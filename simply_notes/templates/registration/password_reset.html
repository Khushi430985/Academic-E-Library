{% extends "layout/layout.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<h2>Forgot Password</h2>
<p>Enter your email, and we'll send you a password reset link.</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send Reset Link</button>
</form>
{% endblock %}
